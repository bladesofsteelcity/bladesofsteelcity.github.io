<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Event photos from the 2026 Blades of Steel City charity hockey tournament.">
  <title>2026 Photo Gallery | Blades of Steel City</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0b0d10;
      color: #fff;
      font: 1.0625rem/1.6 Satoshi, system-ui, sans-serif;
    }
    .wrap { width: min(100% - 2.5rem, 74rem); margin-inline: auto; }
    header { border-bottom: 1px solid #333a43; }
    header a {
      display: inline-flex;
      align-items: center;
      gap: .75rem;
      padding-block: .8rem;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    header img { width: 3rem; height: auto; }
    main { padding-block: clamp(3rem, 9vw, 8rem); }
    .kicker {
      color: #fac526;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 19ch;
      margin: 0 0 1rem;
      font: 700 clamp(2.35rem, 6.5vw, 5rem)/1.1 "Clash Display", Impact, sans-serif;
      letter-spacing: .025em;
      word-spacing: .12em;
      text-transform: uppercase;
    }
    .status { max-width: 55ch; margin-bottom: 1.75rem; color: #b5bdc7; }
    .back { color: #fac526; font-weight: 700; text-underline-offset: .25em; }
    a:focus-visible { outline: 3px solid #fac526; outline-offset: 4px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a href="./">
        <img src="assets/logo-mark.webp" alt="" width="320" height="291">
        Blades of Steel City
      </a>
    </div>
  </header>
  <main class="wrap">
    <p class="kicker">Pittsburgh · November 12, 2026</p>
    <h1>2026 Photo Gallery</h1>
    <p class="status">Event photos are coming soon. Check back here to browse and download them when the album is ready.</p>
    <a class="back" href="./#results">Back to the tournament results</a>
  </main>
</body>
</html>
